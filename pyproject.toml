[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debriefr"
version = "0.1.0"
description = "Transcribe, diarize, identify speakers, and summarize meeting recordings. Optionally sync action items to GitHub Projects."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "alopezespino" }]
keywords = [
    "whisper",
    "transcription",
    "diarization",
    "pyannote",
    "meeting-notes",
    "speaker-identification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    "torch>=2.2,<2.6",
    "torchaudio>=2.2,<2.6",
    "pyannote.audio>=3.3",
    "huggingface_hub>=0.23,<0.28",
    "numpy<2",
    "soundfile",
    "anthropic>=0.40",
    "openai>=1.0",
    "imageio-ffmpeg",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mlx = ["mlx-whisper"]
local = ["faster-whisper>=1.0"]
all = ["mlx-whisper", "faster-whisper>=1.0"]

[project.scripts]
debriefr = "debriefr.cli:main"

[project.urls]
Homepage = "https://github.com/alopezespino/debriefr"
Issues = "https://github.com/alopezespino/debriefr/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["debriefr*"]

[tool.setuptools.package-data]
debriefr = ["prompts/*.md"]
